name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Type Check & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apilens/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apilens
        run: pnpm install --frozen-lockfile

      - name: Type check (build)
        working-directory: apilens
        run: pnpm build

      - name: Lint
        working-directory: apilens
        run: pnpm lint
